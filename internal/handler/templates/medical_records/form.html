{{define "title"}}Rekam Medis Baru{{end}}

{{define "content"}}
<div class="page-header">
    <div>
        <h1 class="page-title">Rekam Medis Baru</h1>
        <p class="page-subtitle">Buat rekam medis pemeriksaan pasien</p>
    </div>
    <a href="/medical-records" class="btn btn-secondary">Kembali</a>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Form Rekam Medis</h3>
    </div>
    <div class="card-body">
        {{if .Error}}
        <div class="alert alert-danger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/medical-records/save">
            <div class="form-section">
                <div class="form-section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Data Pasien & Dokter
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Pasien <span class="text-danger">*</span></label>
                        <select name="patient_id" class="form-select" required>
                            <option value="">-- Pilih Pasien --</option>
                            {{range (index .Data "Patients")}}
                            <option value="{{.ID}}">{{.FullName}} ({{.MedicalRecordNumber}})</option>
                            {{end}}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Dokter <span class="text-danger">*</span></label>
                        <select name="doctor_id" class="form-select" required>
                            <option value="">-- Pilih Dokter --</option>
                            {{range (index .Data "Doctors")}}
                            <option value="{{.ID}}">{{.FullName}} - {{.Specialization}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tanggal Pemeriksaan <span class="text-danger">*</span></label>
                        <input type="date" name="examination_date" class="form-input" value="{{now}}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">No. Registrasi</label>
                        <input type="number" name="registration_id" class="form-input" placeholder="ID Registrasi (opsional)">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Pemeriksaan
                </div>

                <div class="form-group">
                    <label class="form-label">Keluhan Utama</label>
                    <textarea name="chief_complaint" class="form-textarea" rows="2" placeholder="Keluhan utama pasien..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Anamnesis</label>
                    <textarea name="anamnesis" class="form-textarea" rows="3" placeholder="Riwayat penyakit..."></textarea>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    Tanda Vital
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Suhu (&deg;C)</label>
                        <input type="number" name="temperature" class="form-input" step="0.1" placeholder="36.5">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nadi (x/menit)</label>
                        <input type="number" name="heart_rate" class="form-input" placeholder="80">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tekanan Darah</label>
                        <input type="text" name="blood_pressure" class="form-input" placeholder="120/80">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Respirasi (x/menit)</label>
                        <input type="number" name="respiratory_rate" class="form-input" placeholder="20">
                    </div>
                    <div class="form-group">
                        <label class="form-label">BB (kg)</label>
                        <input type="number" name="weight" class="form-input" step="0.1" placeholder="70">
                    </div>
                    <div class="form-group">
                        <label class="form-label">TB (cm)</label>
                        <input type="number" name="height" class="form-input" step="0.1" placeholder="170">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    Pemeriksaan Fisik
                </div>

                <div class="form-group">
                    <label class="form-label">Pemeriksaan Fisik</label>
                    <textarea name="physical_examination" class="form-textarea" rows="4" placeholder="Hasil pemeriksaan fisik..."></textarea>
                </div>
            </div>

            <div class="form-section">
                <div class="form-section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    Catatan
                </div>

                <div class="form-group">
                    <label class="form-label">Catatan Tambahan</label>
                    <textarea name="notes" class="form-textarea" rows="2" placeholder="Catatan..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <a href="/medical-records" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary">Simpan Rekam Medis</button>
            </div>
        </form>
    </div>
</div>
{{end}}
